# Knowledge-Web Configuration
# ============================

# API Keys
youtube_api_key: ""
anthropic_api_key: ""
brave_search_key: ""

# Paths
vault_path: "./Knowledge-Web"
queue_db: "_system/queue.db"
vault_index: "_system/vault-index.json"

# LLM Settings
llm_model: "claude-sonnet-4-20250514"
llm_max_tokens: 8000
llm_temperature: 0.2

# Transcript Settings
transcript_source: "youtube_first"  # youtube_first | whisper_only
whisper_model: "medium"             # tiny | base | small | medium | large
whisper_device: "cpu"               # cpu | cuda

# Webshare Rotating Residential Proxy (optional, strongly recommended for playlist processing)
# Sign up at webshare.io and purchase a "Residential" proxy plan (NOT "Proxy Server" or "Static Residential").
# When configured, transcript requests route through rotating IPs to avoid YouTube rate-limiting.
webshare_proxy_username: ""
webshare_proxy_password: ""

# Rate Limiting & Quotas
youtube_daily_quota: 10000     # YouTube Data API v3: 10,000 units/day
youtube_quota_reserve: 200     # Units reserved for Watch system
inter_video_delay: 2           # Seconds to wait between processing videos

# Retry Settings
max_retry_count: 3             # Max times to retry a failed video

# Enrichment
scholarly_search: true
scholarly_provider: "openalex"      # openalex (free) | semantic_scholar
web_search: true
web_search_provider: "brave"        # brave | serp

# Watch Settings
watch:
  enabled: true
  check_interval_hours: 6
  channels: []  # Managed via watch.py --subscribe

# Discover Settings
discover:
  enabled: true
  schedule: "daily"
  auto_ingest_youtube: true
  auto_ingest_youtube_min_views: 10000
  auto_add_articles: false
  auto_add_papers: false
  topics_per_run: 20
  results_per_topic: 5
